{
    version: 9,
    name: "Generic",
    "fileformats": [
        { "format": "Valve", "initialmap": "initial_valve.map" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "textures",
        "format": { "extensions": [".png"], "format": "image" }
    },
    "entities": {
        "definitions": [ "FPS.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "faceattribs": {
        "defaults": {
            "scale": [ 1.0, 1.0 ]
        },
        "surfaceflags": [],
        "contentflags": []
    },
    "tags": {
        "brush": [
            {
                "name": "trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*"
            }
        ]
    }
}
