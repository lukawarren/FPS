{
    version: 7,
    name: "FPS",
    "fileformats": [
        { "format": "Valve", "initialmap": "initial_valve.map" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "textures": {
        "root": "textures",
        "format": { "extensions": [".png"], "format": "image" }
    },
    "entities": {
        "definitions": [ "FPS.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "faceattribs": {
        "defaults": {
            "scale": [ 0.25, 0.25 ]
        },
        "surfaceflags": [],
        "contentflags": []
    }
}
